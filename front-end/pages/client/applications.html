<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applications - GigsForGigs</title>
  <meta name="description" content="Review gig applications for a client task.">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/client-dashboard.css">
</head>
<body>

<div class="dashboard-layout">
  <aside class="dashboard-sidebar">
    <a href="client-dashboard.html" class="client-sidebar-brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M8 12l3 3 5-5"></path></svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">GigFlow</span>
        <span class="brand-sub">Client Portal</span>
      </div>
    </a>

    <nav class="sidebar-nav">
      <a href="client-dashboard.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Dashboard
      </a>
      <a href="search-talent.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Search Talent
      </a>
      <a href="my-gigs-client.html" class="nav-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        Active Contracts
      </a>
      <a href="client-profile-selection.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        Supervise Manager
      </a>
    </nav>

    <div class="sidebar-user-info">
      <div class="user-avatar user-avatar-seagrass">CL</div>
      <div class="user-details">
        <div class="user-name">Client</div>
        <div class="user-role">Client Account</div>
      </div>
      <div class="online-dot"></div>
    </div>
  </aside>

  <main class="dashboard-main">
    <header class="dashboard-topbar">
      <div class="topbar-actions">
        <a href="post-gig.html" class="btn-post-gig">
          <svg fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Post a Task
        </a>
      </div>
    </header>

    <div class="dashboard-content">
      <div class="page-header">
        <a href="client-dashboard.html" class="back-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Dashboard
        </a>
        <h1 class="page-title">Applications</h1>
        <p class="page-subtitle">Task: <span id="applications-task-title">Loading...</span></p>
      </div>

      <div class="activity-section">
        <div class="activity-header">
          <h2 class="activity-title">Gig Applications</h2>
        </div>

        <table class="activity-table" id="applications-table">
          <thead>
            <tr>
              <th>Application ID</th>
              <th>Gig ID</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" style="text-align:center;padding:2rem;">Loading applications...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module" src="../../js/client.js"></script>

</body>
</html>
