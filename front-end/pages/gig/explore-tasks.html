<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Tasks - GigsForGigs</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <style>
    .explore-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.2s ease;
    }
    .explore-card:hover {
      border-color: var(--color-primary-blue);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }
    .explore-image {
      width: 100%;
      height: 140px;
      background-color: var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-text-muted);
    }
    .explore-content {
      padding: var(--spacing-lg);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .explore-title {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--color-text-dark);
      margin-bottom: var(--spacing-xs);
    }
    .explore-client {
      font-size: 0.875rem;
      color: var(--color-text-muted);
      margin-bottom: var(--spacing-md);
    }
    .explore-price {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-secondary);
      margin-bottom: var(--spacing-lg);
    }
    .explore-footer {
      margin-top: auto;
    }
    .filter-bar {
      display: flex;
      gap: var(--spacing-md);
      margin-bottom: var(--spacing-xl);
      background-color: var(--color-white);
      padding: var(--spacing-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    .pagination {
      display: flex;
      justify-content: center;
      gap: var(--spacing-sm);
      margin-top: var(--spacing-xxl);
    }
    .page-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--color-border);
      background-color: var(--color-white);
      color: var(--color-text-dark);
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-decoration: none;
    }
    .page-btn.active {
      background-color: var(--color-primary-dark);
      color: var(--color-white);
      border-color: var(--color-primary-dark);
    }
  </style>
</head>
<body>

<div class="dashboard-layout">
  
  <!-- Sidebar -->
  <aside class="dashboard-sidebar">
    <a href="gig-dashboard.html" class="sidebar-header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--color-white)"><circle cx="12" cy="12" r="10"/></svg>
      GigsForGigs
    </a>
    
    <nav class="sidebar-nav">
      <a href="gig-dashboard.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Dashboard
      </a>
      <a href="explore-tasks.html" class="nav-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Explore Tasks
      </a>
      <a href="active-tasks.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        Active Tasks
      </a>
      <a href="pending-requests.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Pending Requests
      </a>
      <a href="completed-projects.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Completed projects
      </a>
      <a href="total-earnings.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        Total Earnings
      </a>
      <a href="post-service.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Post a Service
      </a>
      <a href="gig-profile.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        My Profile
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="profile-mini">GP</div>
      <div style="font-size: 0.875rem;">
        <div style="font-weight: 600;">—</div>
        <div style="color: rgba(240, 246, 246, 0.7); font-size: 0.75rem;">Gig Professional</div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="dashboard-main">
    
    <header class="dashboard-topbar">
      <div style="display: flex; gap: var(--spacing-lg); align-items: center;">
        <button class="btn btn-primary" onclick="window.location.href='post-service.html'">Post a Service</button>
      </div>
    </header>

    <div class="dashboard-content container">
      
      <div style="margin-bottom: var(--spacing-lg);">
        <h1 class="page-title" style="margin-bottom: var(--spacing-sm);">Explore Tasks</h1>
        <p style="color: var(--color-text-muted);">Find great projects that match your skills.</p>
      </div>
      
      <!-- Filter Bar -->
      <div class="filter-bar">
        <select id="explore-category-filter" class="form-input" style="flex: 1; border: none; background: transparent; padding: 0 var(--spacing-sm);">
          <option value="">All Categories</option>
          <option value="design">Design</option>
          <option value="dev">Development</option>
          <option value="marketing">Marketing</option>
        </select>
        <div style="width: 1px; background-color: var(--color-border); margin: 4px 0;"></div>
        <select id="explore-budget-filter" class="form-input" style="flex: 1; border: none; background: transparent; padding: 0 var(--spacing-sm);">
          <option value="">Any Budget</option>
          <option value="1">Under $500</option>
          <option value="2">$500 - $1k</option>
          <option value="3">$1k+</option>
        </select>
        <div style="width: 1px; background-color: var(--color-border); margin: 4px 0;"></div>
        <select id="explore-duration-filter" class="form-input" style="flex: 1; border: none; background: transparent; padding: 0 var(--spacing-sm);">
          <option value="">Any Duration</option>
          <option value="1">Less than 1 week</option>
          <option value="2">1 - 4 weeks</option>
          <option value="3">1 month+</option>
        </select>
        <button id="explore-filter-btn" class="btn btn-primary" style="padding: 8px 16px;">Filter</button>
      </div>
      
      <!-- Grid -->
      <div id="explore-tasks-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--spacing-xl);"></div>

      <!-- Pagination -->
      <div id="explore-pagination" class="pagination">
        <a href="#" class="page-btn active">1</a>
      </div>

    </div>
  </main>
</div>

<script type="module" src="../../js/gig.js"></script>

</body>
</html>
