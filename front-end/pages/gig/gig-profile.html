<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - GigsForGigs</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <style>
    .profile-hero {
      background-color: var(--color-primary-dark);
      background-image: var(--gradient-top);
      height: 180px;
      border-radius: var(--radius-lg);
      margin-bottom: var(--spacing-xxl);
      position: relative;
    }
    .profile-avatar-container {
      position: absolute;
      bottom: -40px;
      left: 40px;
      display: flex;
      align-items: flex-end;
      gap: var(--spacing-lg);
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      background-color: var(--color-bg-light);
      border: 4px solid var(--color-white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--color-primary-blue);
      box-shadow: var(--shadow-sm);
    }
    .profile-info-header {
      margin-bottom: 8px;
    }
    .profile-info-header h1 {
      color: var(--color-white);
      font-size: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    .profile-subtitle {
      color: rgba(240, 246, 246, 0.9);
      font-size: 1rem;
    }
    .skill-tag {
      background-color: rgba(8, 75, 131, 0.1);
      color: var(--color-primary-dark);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-block;
    }
  </style>
</head>
<body>

<div class="dashboard-layout">
  
  <!-- Sidebar -->
  <aside class="dashboard-sidebar">
    <a id="dashboard-home-link" href="gig-dashboard.html" class="sidebar-header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--color-white)"><circle cx="12" cy="12" r="10"/></svg>
      GigsForGigs
    </a>
    
    <nav class="sidebar-nav">
      <a id="dashboard-nav-link" href="gig-dashboard.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Dashboard
      </a>
      <a href="explore-tasks.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        Explore Tasks
      </a>
      <a href="active-tasks.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        Active Tasks
      </a>
      <a href="pending-requests.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Pending Requests
      </a>
      <a href="completed-projects.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Completed projects
      </a>
      <a href="total-earnings.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        Total Earnings
      </a>
      <a href="post-service.html" class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Post a Service
      </a>
      <a href="gig-profile.html" class="nav-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2" width="20" height="20" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        My Profile
      </a>
    </nav>
    
    <div class="sidebar-footer">
      <div class="profile-mini">GP</div>
      <div style="font-size: 0.875rem;">
        <div style="font-weight: 600;">—</div>
        <div style="color: rgba(240, 246, 246, 0.7); font-size: 0.75rem;">Gig Professional</div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="dashboard-main">
    
    <header class="dashboard-topbar">
      <div style="display: flex; gap: var(--spacing-lg); align-items: center;"></div>
    </header>

    <div id="profile-page-content" class="dashboard-content container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
        <h1 class="page-title" style="margin-bottom: 0;">My Profile</h1>
        <button class="btn btn-outline" style="min-width: 140px;">Edit My Profile</button>
      </div>
      
      <div class="profile-hero">
        <div class="profile-avatar-container">
          <div id="profile-avatar-text" class="profile-avatar">
            GP
          </div>
          <div class="profile-info-header">
            <h1 id="profile-name-text">
              —
              <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--color-secondary)" stroke="var(--color-white)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </h1>
            <div id="profile-subtitle-text" class="profile-subtitle">Gig Professional</div>
          </div>
        </div>
      </div>

      <div style="padding-top: 20px; display: grid; grid-template-columns: 2fr 1fr; gap: var(--spacing-xxl);">
        
        <!-- Main Column -->
        <div>
          <section class="dashboard-section" style="margin-bottom: var(--spacing-lg);">
            <h2 style="font-size: 1.25rem; color: var(--color-primary-dark); margin-bottom: var(--spacing-md);">About Me</h2>
            <p id="about-me-text" style="color: var(--color-text-dark); line-height: 1.6;">No bio added yet.</p>
          </section>

          <section class="dashboard-section">
            <h2 style="font-size: 1.25rem; color: var(--color-primary-dark); margin-bottom: var(--spacing-md);">My Services (Portfolio)</h2>
            
            <div id="services-list" style="display: flex; flex-direction: column; gap: var(--spacing-md);"></div>
          </section>
        </div>

        <!-- Sidebar Column -->
        <div>
          
          <div class="dashboard-section" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-lg);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-md);">
              <h3 style="font-size: 1rem; color: var(--color-text-muted); text-transform: uppercase;">Job Success</h3>
              <div id="job-success-text" style="font-size: 1.25rem; font-weight: 700; color: var(--color-primary-dark);">0%</div>
            </div>
            <div class="progress-container" style="height: 6px;">
              <div id="job-success-bar" class="progress-bar" style="width: 0%;"></div>
            </div>
            
            <div id="job-rating-row" style="margin-top: var(--spacing-lg); display: flex; gap: var(--spacing-sm); align-items: center;"><span style="color: var(--color-text-muted); font-size: 0.875rem;">No reviews yet</span></div>
          </div>

          <div class="dashboard-section" style="padding: var(--spacing-xl); margin-bottom: var(--spacing-lg);">
            <h3 style="font-size: 1rem; color: var(--color-primary-dark); margin-bottom: var(--spacing-lg); font-weight: 700;">Skills</h3>
            <div id="skills-list" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
          </div>

          <div class="dashboard-section" style="padding: var(--spacing-xl);">
            <h3 style="font-size: 1rem; color: var(--color-primary-dark); margin-bottom: var(--spacing-lg); font-weight: 700;">Languages</h3>
            <ul id="languages-list" style="list-style: none; display: flex; flex-direction: column; gap: 8px;"></ul>
          </div>

        </div>

      </div>

    </div>
  </main>
</div>

<script type="module" src="../../js/gig.js"></script>

</body>
</html>
